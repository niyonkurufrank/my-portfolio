<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>contact page</title>
    <link rel="stylesheet" href="../css/contact.css">
    <link rel="stylesheet"  href="https://cdn.jsdelivr.net/npm/remixicon@4.5.0/fonts/remixicon.css">"
</head>
<body>
    <header id="header-container">
        <div id="logo">
            <img id="logo-photo" src="../image/logo.png" alt="Logo">
        </div>
        <div id="menu-container">
            <span id="home-menu">Home</span>
            <span id="about-menu">About</span>
            <span id="contact-menu">Contact</span>
        </div>
        <div id="hire-me-container">
            <button id="hire-me-button">Hire Me</button>
        </div>
    </header>
    <div id="body-container-2">
        <div id="body">
            <div id="text-container">
                <h1>get in touch</h1>
                <h3>I'd like to hear from you!</h3>
                <p id="paragraph">If you have any inquires or just want to say hi, please use the contact form!</p>
                <p id="email"><i class="ri-mail-line"></i>niyonkurufrank91@gmail.com</p>
                <p id="social-media"><i class="ri-thumb-up-line"></i><i class="ri-whatsapp-line" id="social"></i><i class="ri-instagram-line" id="social"></i><i class="ri-facebook-circle-fill" id="social"></i></p>
                <p id="play"><i class="ri-play-circle-line"></i></p>
            </div>
            <div id="boxes-container">
                <div class="boxes">
                    <div class="names">
                        <div class="name">
                            <p class="name">first name</p>
                            <p class="post">last name</p>
                        </div>
                        <div class="inputs">
                            <input type="text" id="name-input" placeholder="Enter your first name">
                            <input type="text" id="name-input" placeholder="Enter your last name">
                        </div>  
                    </div>
                    <div class="email">
                        <p class="name">email</p>
                        <div class="email-input">
                            <input type="email" id="email-input" placeholder="Enter your email">
                        </div>
                    </div>
                    <div class="message">
                        <p class="name">message</p>
                        <textarea id="message-input" placeholder="Enter your message"></textarea>
                    </div>
                    <div id="send-container">
                        <button id="send-button">send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
